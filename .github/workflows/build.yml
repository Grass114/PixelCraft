name: Build PixelCraft

on:
  push:
    tags:
      - 'v*'  # 推送 v1.2, v1.3 等 tag 时自动构建
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install pyinstaller Pillow
          pip install tkinterdnd2 || echo "tkinterdnd2 安装失败，跳过"

      - name: 打包 Windows
        run: |
          pyinstaller --onefile --windowed --name PixelCraft pixel_craft.py
          # 解决中文路径问题
          $env:PYTHONUTF8 = "1"

      - name: 上传 Windows 版本
        uses: actions/upload-artifact@v4
        with:
          name: PixelCraft-Windows
          path: dist/PixelCraft.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install pyinstaller Pillow
          pip install tkinterdnd2 || echo "tkinterdnd2 安装失败，跳过"

      - name: 打包 Linux
        run: |
          pyinstaller --onefile --name PixelCraft pixel_craft.py

      - name: 上传 Linux 版本
        uses: actions/upload-artifact@v4
        with:
          name: PixelCraft-Linux
          path: dist/PixelCraft

  build-macos:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install pyinstaller Pillow
          pip install tkinterdnd2 || echo "tkinterdnd2 安装失败，跳过"

      - name: 打包 macOS
        run: |
          pyinstaller --onefile --windowed --name PixelCraft pixel_craft.py

      - name: 上传 macOS 版本
        uses: actions/upload-artifact@v4
        with:
          name: PixelCraft-macOS
          path: dist/PixelCraft

  create-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/PixelCraft-Windows/PixelCraft.exe
            artifacts/PixelCraft-Linux/PixelCraft
            artifacts/PixelCraft-macOS/PixelCraft
          draft: false
          prerelease: false
