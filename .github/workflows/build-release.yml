name: Build and Release x86 EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 支持在网页 Actions 页面手动点击运行

permissions:
  contents: write

jobs:
  build-x86:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./Windows-src # 指定工作目录

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (x86)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # 更新为 3.12
          architecture: 'x86'    # 坚持 32 位架构

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 指定安装较新版本的 Pillow，确保在 3.12 下能拉到 x86 的预编译 whl 包
          pip install pyinstaller "pillow>=10.1.0" tkinterdnd2

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name PixelCraft_x86 ^
            --hidden-import=PIL._tkinter_finder ^
            --hidden-import=PIL._imagingtk ^
            pixel_craft.py

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: Windows-src/dist/PixelCraft_x86.exe
          generate_release_notes: true
