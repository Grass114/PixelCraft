name: Build and Release x86 EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 支持网页手动触发

permissions:
  contents: write

jobs:
  build-x86:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./Windows-src

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (x86)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x86'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow tkinterdnd2

      - name: Build with PyInstaller
        run: pyinstaller --onefile --windowed --name PixelCraft_x86 --hidden-import=PIL._tkinter_finder --hidden-import=PIL._imagingtk pixel_craft.py

      # 新增：每次运行都会保存到 Artifacts，可直接下载
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelCraft_x86
          path: Windows-src/dist/PixelCraft_x86.exe

      # 原有的：打 Tag 时自动发布到 Release
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: Windows-src/dist/PixelCraft_x86.exe
          generate_release_notes: true
