name: Build and Release x86 EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-x86:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./Windows-src

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (x86)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x86'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow tkinterdnd2

      - name: Build with PyInstaller
        # 下面这行千万不要加 ^，直接在一行写完
        run: pyinstaller --onefile --windowed --name PixelCraft_x86 --hidden-import=PIL._tkinter_finder --hidden-import=PIL._imagingtk pixel_craft.py

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: Windows-src/dist/PixelCraft_x86.exe
          generate_release_notes: true
