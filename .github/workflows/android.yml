name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 去除 buildozer.spec 的 BOM
        run: |
          if [ -f buildozer.spec ]; then
            sed -i '1s/^\xEF\xBB\xBF//' buildozer.spec
          fi

      - name: 安装系统依赖
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk \
            python3-pip autoconf automake autoconf-archive \
            libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev \
            libjpeg-dev libtiff-dev libwebp-dev \
            m4

      - name: 安装 buildozer 和 cython
        run: |
          pip3 install --user buildozer cython
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 构建 APK
        run: |
          buildozer android debug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelCraft-Android
          path: bin/*.apk

      - name: 上传到 Release（如果打了 tag）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          draft: false
          prerelease: false