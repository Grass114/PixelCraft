name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 去除 buildozer.spec 的 BOM
        run: |
          if [ -f buildozer.spec ]; then
            sed -i '1s/^\xEF\xBB\xBF//' buildozer.spec
          fi

      - name: 构建 APK（自动回答 yes）
        run: |
          export BUILDOZER_IGNORE_ROOT=1
          yes | buildozer android debug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelCraft-Android
          path: bin/*.apk

      - name: 上传到 Release（如果打了 tag）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          draft: false
          prerelease: false